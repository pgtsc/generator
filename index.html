<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DC Generator - Responsive</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap');

    body { 
        margin: 0; 
        padding: 0;
        overflow: hidden; 
        background-color: #050505; 
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
    }



    
    /* --- Hamburger Menu Icon (Mobile Only) --- */
    #menu-toggle {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 2000;
        background: rgba(0, 255, 204, 0.2);
        border: 1px solid #00ffcc;
        color: #00ffcc;
        padding: 10px 15px;
        border-radius: 8px;
        cursor: pointer;
        display: none; /* Desktop এ হাইড থাকবে */
        font-family: 'Orbitron', sans-serif;
        font-size: 16px;
        backdrop-filter: blur(5px);
    }

    /* --- মাস্টার কন্ট্রোল প্যানেল --- */
    #master-panel {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 340px;
        background: rgba(0, 15, 15, 0.75);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(0, 255, 204, 0.3);
        border-radius: 20px;
        padding: 25px;
        color: white;
        z-index: 1000;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
        transition: transform 0.4s ease, opacity 0.4s ease;
    }

    /* --- Mobile Responsive CSS --- */
    @media (max-width: 768px) {
        #menu-toggle {
            display: block; /* মোবাইলে দেখাবে */
        }
        #master-panel {
            top: 80px;
            right: 15px;
            width: calc(100% - 60px);
            max-width: 300px;
            transform: translateX(150%); /* শুরুতে স্ক্রিনের বাইরে থাকবে */
            opacity: 0;
            pointer-events: none;
            max-height: 70vh;
            overflow-y: auto; /* প্যানেল বড় হলে স্ক্রল করা যাবে */
        }
        #master-panel.active {
            transform: translateX(0); /* ক্লিক করলে শো করবে */
            opacity: 1;
            pointer-events: auto;
        }
    }

    .panel-title {
        font-family: 'Orbitron', sans-serif;
        font-size: 18px;
        font-weight: 700;
        color: #00ffcc;
        margin-bottom: 25px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid rgba(0, 255, 204, 0.2);
        padding-bottom: 12px;
    }

    .status-badge {
        font-size: 10px;
        background: rgba(0, 255, 204, 0.1);
        padding: 4px 8px;
        border-radius: 4px;
        color: #00ffcc;
        border: 1px solid #00ffcc;
    }

    .control-item { margin-bottom: 22px; }
    .control-item label { 
        display: flex; 
        justify-content: space-between; 
        font-size: 15px; 
        margin-bottom: 10px; 
        color: #eee; 
        font-weight: 500; 
    }
    .val-text { color: #00ffcc; font-family: 'Orbitron', sans-serif; font-size: 12px; }

    input[type=range] {
        width: 100%;
        height: 6px;
        background: #1a1a1a;
        border-radius: 5px;
        outline: none;
        accent-color: #00ffcc;
        cursor: pointer;
    }

    .toggle-group { 
        display: flex; 
        align-items: center; 
        justify-content: space-between; 
        margin-bottom: 15px; 
        padding: 10px;
        background: rgba(255,255,255,0.03);
        border-radius: 8px;
        transition: 0.3s;
    }
    .toggle-group:hover { background: rgba(0, 255, 204, 0.05); }
    .toggle-group span { font-size: 15px; }
    .toggle-group input { width: 18px; height: 18px; cursor: pointer; accent-color: #00ffcc; }

    .btn-pause {
        width: 100%;
        padding: 14px;
        background: transparent;
        border: 1px solid #ff3366;
        color: #ff3366;
        border-radius: 12px;
        font-family: 'Orbitron', sans-serif;
        font-weight: 700;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .btn-pause:hover { background: rgba(255, 51, 102, 0.1); }
    .btn-pause.active { background: #ff3366; color: white; box-shadow: 0 0 15px rgba(255, 51, 102, 0.5); }

    #watermark { position: absolute; bottom: 20px; left: 20px; color: rgba(255,255,255,0.2); font-size: 12px; letter-spacing: 2px; }
  </style>
</head>
<body>

  <button id="menu-toggle">☰ MENU</button>

  <div id="master-panel">
      <div class="panel-title">
          <span>Control Panel</span>
      </div>

      <div class="control-item">
          <label>Armature Speed <span id="speed-val" class="val-text">0.10</span></label>
          <input type="range" id="speed-slider" min="0" max="0.5" step="0.01" value="0.1">
      </div>

      <div class="control-item">
          <label>Armature Opacity <span id="opacity-val" class="val-text">0.3</span></label>
          <input type="range" id="opacity-slider" min="0" max="1" step="0.05" value="0.3">
      </div>

      <div class="control-item">
          <div class="toggle-group">
              <span>Show Magnetic Flux</span>
              <input type="checkbox" id="flux-toggle" checked>
          </div>
          <div class="toggle-group">
              <span>Show Electrons Flow</span>
              <input type="checkbox" id="electron-toggle" checked>
          </div>
          <div class="toggle-group">
              <span>Show Shaft & Wheel</span>
              <input type="checkbox" id="shaft-toggle" checked>
          </div>
          <div class="toggle-group">
              <span>Show Armature Mesh</span>
              <input type="checkbox" id="armature-toggle" checked>
          </div>
      </div>

      <button id="pause-btn" class="btn-pause">Pause Simulation</button>
  </div>

  <div id="watermark">DC GENERATOR</div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // --- UI Responsive Logic ---
    const menuToggle = document.getElementById('menu-toggle');
    const masterPanel = document.getElementById('master-panel');

    menuToggle.addEventListener('click', () => {
        masterPanel.classList.toggle('active');
        if (masterPanel.classList.contains('active')) {
            menuToggle.innerText = '✕ CLOSE';
        } else {
            menuToggle.innerText = '☰ MENU';
        }
    });

    // --- SCENE SETUP (Original) ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);

    // ক্যামেরা সেটআপ 
    const isMobile = window.innerWidth < 768;
    const camera = new THREE.PerspectiveCamera(isMobile ? 90 : 70, window.innerWidth / window.innerHeight, 0.1, 1000);
    if (isMobile) { camera.position.set(0, 20, 30); 
    } else {camera.position.set(15, 12, 20);}

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const pointLight = new THREE.PointLight(0xffffff, 2);
    pointLight.position.set(10, 20, 10);
    scene.add(pointLight);

    // --- GUI SETTINGS ---
    const guiSettings = {
      rotationSpeed: 0.1,
      showFluxLines: true,
      showShaftAndWheel: true,
      showArmature: true,
      showElectrons: true,
      armatureOpacity: 0.3,
      isPaused: false
    };

  function createLabelPlane(text, bgColor, width = 2, height = 2) {
      const canvas = document.createElement('canvas');
      canvas.width = 400;
      canvas.height = 400;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.font = 'Bold 300px Arial';
      ctx.fillStyle = 'white';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, canvas.width/2, canvas.height/2);
      const tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      const planeGeo = new THREE.PlaneGeometry(width, height);
      const planeMat = new THREE.MeshStandardMaterial({ map: tex, transparent: true, side: THREE.DoubleSide });
      return new THREE.Mesh(planeGeo, planeMat);
  }

  const innerRadius = 2.5, magnetHeight = 4, magnetWidth = 2, magnetLength = 8;
  function createMagnetShape() {
    const s = new THREE.Shape();
    s.moveTo(innerRadius, -magnetHeight / 2); 
    s.lineTo(innerRadius + magnetWidth, -magnetHeight / 2); 
    s.lineTo(innerRadius + magnetWidth, magnetHeight / 2); 
    s.lineTo(innerRadius, magnetHeight / 2); 
    const startAngle = Math.asin((magnetHeight / 2) / innerRadius);
    s.absarc(0, 0, innerRadius, startAngle, -startAngle, true); 
    return s;
  }
    
    const mGeo = new THREE.ExtrudeGeometry(createMagnetShape(), { depth: magnetLength, bevelEnabled: false, curveSegments: 64 });
    const mN = new THREE.Mesh(mGeo, new THREE.MeshStandardMaterial({ color: 0xee3311 }));
    mN.rotation.y = Math.PI; mN.position.set(0, 0, 2); scene.add(mN);

    const mS = new THREE.Mesh(mGeo, new THREE.MeshStandardMaterial({ color: 0x1133ee }));
    mS.position.set(0, 0, -6); scene.add(mS);

    const nPlane = createLabelPlane('N', '#ee3311', 1.5, 1.5);
    nPlane.position.set(-3.5, 0, 2.01); scene.add(nPlane);

    const sPlane = createLabelPlane('S', '#1133ee', 1.5, 1.5);
    sPlane.position.set(3.5, 0, 2.01); scene.add(sPlane);

    const rotatingGroup = new THREE.Group();
    scene.add(rotatingGroup);

    const shaft = new THREE.Mesh( new THREE.CylinderGeometry(0.12, 0.12, 12, 16), new THREE.MeshStandardMaterial({ color: 0x888888 }));
    shaft.rotation.x = Math.PI / 2;
    rotatingGroup.add(shaft);

    const innerR = 0.5, outerR = 0.6, rHeight = 0.8, slit = 0.15;
    function createSegment(start, end) {
      const s = new THREE.Shape();
      s.absarc(0, 0, outerR, start, end, false);
      s.absarc(0, 0, innerR, end, start, true);
      return new THREE.ExtrudeGeometry(s, { depth: rHeight, bevelEnabled: false, curveSegments: 32 });
    }
    const commMat = new THREE.MeshStandardMaterial({ color: 0xffa520, metalness: 0.5, roughness: 0.2 });
    const seg1 = new THREE.Mesh(createSegment(-Math.PI/2 + slit, Math.PI/2 - slit), commMat);
    const seg2 = new THREE.Mesh(createSegment(Math.PI/2 + slit, 3*Math.PI/2 - slit), commMat);
    seg1.position.z = 2.5; seg2.position.z = 2.5;
    rotatingGroup.add(seg1, seg2);

    const slipRingCylinder = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.8, 16), new THREE.MeshStandardMaterial({ color: 0x888888}));
    slipRingCylinder.rotation.x = Math.PI/2; slipRingCylinder.position.set(0, 0, 2.9);
    rotatingGroup.add(slipRingCylinder);

    function createSmoothPath(points, jointRadius = 0.2) {      
        const path = new THREE.CurvePath();
        for (let i = 0; i < points.length - 1; i++) {
            const p1 = points[i];
            const p2 = points[i + 1];
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            const segmentLen = p1.distanceTo(p2);
            const offset = Math.min(jointRadius, segmentLen / 2.1);
            const start = p1.clone().add(dir.clone().multiplyScalar(i === 0 ? 0 : offset));
            const end = p2.clone().sub(dir.clone().multiplyScalar(i === points.length - 2 ? 0 : offset));
            path.add(new THREE.LineCurve3(start, end));
            if (i < points.length - 2) {
                const nextP = points[i + 2];
                const nextDir = new THREE.Vector3().subVectors(nextP, p2).normalize();
                const nextStart = p2.clone().add(nextDir.clone().multiplyScalar(offset));
                path.add(new THREE.QuadraticBezierCurve3(end, p2, nextStart));
            }
        }
        return path;
    }

    const points = [
      new THREE.Vector3(0.48, 0, 3), new THREE.Vector3(0.4, 0, 2), new THREE.Vector3(1.5, 0, 2.0),
      new THREE.Vector3(1.5, 0, -5.5), new THREE.Vector3(-1.5, 0, -5.5),
      new THREE.Vector3(-1.5, 0, 2.0), new THREE.Vector3(-0.4, 0, 2.0), new THREE.Vector3(-0.48, 0, 3)
    ];
    const loopPath = createSmoothPath(points, 0.5);

    const loopMesh = new THREE.Mesh(new THREE.TubeGeometry(loopPath, 160, 0.08, 8, false), 
    new THREE.MeshStandardMaterial({color: 0xffa520, metalness: 0.5, roughness: 0.2, transparent: true, opacity: 0.3 }));
    rotatingGroup.add(loopMesh);

    const wheelGroup = new THREE.Group();
    const wheelGeo = new THREE.TorusGeometry(1.2, 0.15, 16, 50);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.4, roughness: 0.3 });
    const wheel = new THREE.Mesh(wheelGeo, wheelMat); wheelGroup.add(wheel);
    for (let i = 0; i < 4; i++) { const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.4, 8), wheelMat); spoke.rotation.z = (Math.PI / 4) * i; wheelGroup.add(spoke); }
    const handleBar = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8, 12), new THREE.MeshStandardMaterial({ color: 0x888888 }));
    handleBar.position.set(1.1, 0, 0.4); handleBar.rotation.x = Math.PI / 2; wheelGroup.add(handleBar);
    const handleGrip = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.5, 12), new THREE.MeshStandardMaterial({ color: 0xcc0000 }));
    handleGrip.position.set(1.1, 0, 0.8); handleGrip.rotation.x = Math.PI / 2; wheelGroup.add(handleGrip);
    wheelGroup.position.z = 6; rotatingGroup.add(wheelGroup);

    const staticGroup = new THREE.Group(); scene.add(staticGroup);
    const brushMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    const b1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.4, 0.5), brushMat); b1.position.set(0.62, 0, 2.9);
    const b2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.4, 0.5), brushMat); b2.position.set(-0.62, 0, 2.9);
    staticGroup.add(b1, b2);

    const wire1Pts = [new THREE.Vector3(0.62, 0, 2.9), new THREE.Vector3(4, 0, 2.9), new THREE.Vector3(4, -1, 2.9), new THREE.Vector3(-4, -1, 2.9), new THREE.Vector3(-4, -1, 5), new THREE.Vector3(-4, 0, 5)];
    const wire2Pts = [new THREE.Vector3(-0.62, 0, 2.9), new THREE.Vector3(-4, 0, 2.9), new THREE.Vector3(-4, 0, 5)];

    staticGroup.add(new THREE.Mesh(new THREE.TubeGeometry(createSmoothPath(wire1Pts, 0.4), 80, 0.05, 8), brushMat));
    staticGroup.add(new THREE.Mesh(new THREE.TubeGeometry(createSmoothPath(wire2Pts, 0.4), 80, 0.05, 8), brushMat));

    const bulbRoot = new THREE.Group(); bulbRoot.position.set(-4, 1, 5); staticGroup.add(bulbRoot);
    const glass = new THREE.Mesh(new THREE.SphereGeometry(0.8, 20, 20), new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 }));
    const bulbBase = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.6), new THREE.MeshStandardMaterial({ color: 0x555555 })); bulbBase.position.set(0, -1, 0);
    const filamentMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
    const filament = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.03, 8, 16), filamentMat);
    const bLight = new THREE.PointLight(0xffcc00, 0, 15);
    bulbRoot.add(glass, bulbBase, filament, bLight);

    const electrons = [];
    for (let i = 0; i < 25; i++) {
      const eMesh = new THREE.Mesh(new THREE.SphereGeometry(0.1, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0xffff00 }));
      electrons.push({ mesh: eMesh, offset: i / 25 });
      rotatingGroup.add(eMesh);
    }

    const fluxGroup = new THREE.Group();
    const arrowDir = new THREE.Vector3(1, 0, 0);
    for (let y = -1.8; y <= 1.8; y += 0.6) {
      for (let z = -5.8; z <= 1.8; z += 1) {
        fluxGroup.add(new THREE.ArrowHelper(arrowDir, new THREE.Vector3(-1.8, y, z), 3.5, 0x005500, 0.4, 0.2));
      }
    }
    scene.add(fluxGroup);

    // --- LOGIC ---
    const speedSlider = document.getElementById('speed-slider');
    const opacitySlider = document.getElementById('opacity-slider');
    const fluxToggle = document.getElementById('flux-toggle');
    const electronToggle = document.getElementById('electron-toggle');
    const shaftToggle = document.getElementById('shaft-toggle');
    const armatureToggle = document.getElementById('armature-toggle');
    const pauseBtn = document.getElementById('pause-btn');

    speedSlider.addEventListener('input', (e) => {
        guiSettings.rotationSpeed = parseFloat(e.target.value);
        document.getElementById('speed-val').innerText = guiSettings.rotationSpeed.toFixed(2);
    });

    opacitySlider.addEventListener('input', (e) => {
        guiSettings.armatureOpacity = parseFloat(e.target.value);
        loopMesh.material.opacity = guiSettings.armatureOpacity;
        document.getElementById('opacity-val').innerText = guiSettings.armatureOpacity.toFixed(2);
    });

    fluxToggle.addEventListener('change', (e) => fluxGroup.visible = e.target.checked);
    electronToggle.addEventListener('change', (e) => {
        guiSettings.showElectrons = e.target.checked;
        electrons.forEach(eObj => eObj.mesh.visible = guiSettings.showElectrons);
    });
    shaftToggle.addEventListener('change', (e) => {
        shaft.visible = e.target.checked;
        wheelGroup.visible = e.target.checked;
        slipRingCylinder.visible = e.target.checked;
    });
    armatureToggle.addEventListener('change', (e) => loopMesh.visible = e.target.checked);

    pauseBtn.addEventListener('click', () => {
        guiSettings.isPaused = !guiSettings.isPaused;
        pauseBtn.innerText = guiSettings.isPaused ? "Resume Simulation" : "Pause Simulation";
        pauseBtn.classList.toggle('active');
    });

    let rotation = 0, progress = 0;
    function animate() {
      requestAnimationFrame(animate);
      if (!guiSettings.isPaused) {
        rotation -= guiSettings.rotationSpeed;
        rotatingGroup.rotation.z = rotation;
        let intensity = Math.abs(Math.sin(rotation));
        let velocityFactor = Math.sin(rotation);
        progress += 0.005 * velocityFactor;
        electrons.forEach(e => {
          let eProgress = (progress + e.offset) % 1;
          if (eProgress < 0) eProgress += 1;
          e.mesh.position.copy(loopPath.getPoint(eProgress));
          e.mesh.material.opacity = (Math.abs(velocityFactor) + 0.3) * (guiSettings.showElectrons ? 1 : 0);
          e.mesh.material.transparent = true;
        });
        filamentMat.color.setHSL(0.1, 1, 0.2 + intensity * 0.8);
        bLight.intensity = intensity * 3;
        glass.material.opacity = 0.2 + intensity * 0.4;
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const isMobileNow = width < 768;

      camera.aspect = width / height;
      
      if (isMobileNow) { 
          camera.fov = 90;
          camera.position.set(0, 15, 40); // মোবাইলে সেন্টারিং
          controls.target.set(0, 0, 0);
      } else { 
          camera.fov = 70;
          camera.position.set(15, 12, 20);
          controls.target.set(0, 0, 0);
      }
      
      camera.updateProjectionMatrix();
      controls.update();
      renderer.setSize(width, height);
  });

  </script>
</body>
</html>
